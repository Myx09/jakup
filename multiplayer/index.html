  .map(a => ({ id: a[0], ic: a[1], nm: a[2], x: a[3], y: a[4], r: a[0] === "poker" ? 84 : 54, ly: a[0] === "poker" ? 78 : 54 }));

  else if (pk && id) { const p = pk.seats.find(x => x.id === id); n = p ? p.st : 0; }
  if (n > 0) addBal(n); pk = null; hole = []; pkUI();
}
function pkDo(a, amt) { const m = { t: "pa", a, amt, n: me.n }; if (mode === "host") pkAct(net.id, m); else if (conns[0] && conns[0].open) conns[0].send(m); }
function pkSit(amt) { if (me.b < amt) return; addBal(-amt); pkDo("sit", amt); }
function openPk() { me.g = ST.findIndex(q => q.id === "poker"); $("#pkv").hidden = false; if (mode === "host") pk = pkPub(); pkUI(); }
function closePk() { $("#pkv").hidden = true; me.g = -1; }
$("#pkx").onclick = closePk;
$("#pkb").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.sit) pkSit(+b.dataset.sit); else if (b.dataset.a === "raise") pkDo("raise", +$("#pkr").value); else if (b.dataset.a) pkDo(b.dataset.a);
};
function pkUI() {
  if ($("#pkv").hidden) return; const box = $("#pkb");
  if (!net || !net.id || mode === "solo") { box.innerHTML = '<p class="pkm">Poker is played against other players. Host a room or join one with a code (top bar), then sit down here.</p>'; return; }
  const P = pk || { seats: [], board: [], ph: "wait", pot: 0, msg: "Connecting …" }, id = net.id, my = P.seats.find(p => p.id === id);
  const cd = c => '<span class="cd' + (cs(c) === 1 || cs(c) === 2 ? " r" : "") + '">' + RK[cr(c) - 2].replace("T", "10") + SU[cs(c)] + "</span>", bk = '<span class="cd b"></span>';
  const seats = P.seats.map(p => {
    const cards = p.id === id ? hole.map(cd).join("") : p.sh ? p.sh.map(cd).join("") : p.hc ? bk + bk : "";
    return '<div class="pkp' + (P.turn === p.id ? " t" : "") + (p.fold ? " f" : "") + '"><b>' + esc(p.n) + (P.dl === p.id ? " Ⓓ" : "") + (p.id === id ? " (you)" : "") + "</b><br>" + fmt(p.st) + " chips" + (p.bet ? " · bet " + fmt(p.bet) : "") + (p.ai ? " · all-in" : "") + "<br>" + cards + (p.hn ? "<br>" + p.hn : "") + "</div>";
  }).join("");
  let ctl = "";
  if (!my) ctl = [200, 500, 1000].map(a => '<button data-sit="' + a + '"' + (me.b < a ? " disabled" : "") + ">Sit down · " + a + " chips</button>").join("") + '<p class="pkm">Chips come out of your balance and go back when you leave. Blinds 5/10.</p>';
  else {
    const call = Math.min(P.cur - my.bet, my.st);
    ctl = (P.turn === id ? '<button data-a="fold">Fold</button><button data-a="call">' + (call > 0 ? "Call " + fmt(call) : "Check") + '</button><input type="number" id="pkr" min="1" value="' + Math.min(my.bet + my.st, P.cur + P.mr) + '" aria-label="Raise to"><button data-a="raise">Raise to</button>' : '<span class="pkm">Waiting …</span>') + '<button data-a="leave">Leave table</button>';
  }
  box.innerHTML = '<div class="pkm">' + PHN[P.ph] + " · Pot <b>" + fmt(P.pot) + "</b></div><div>" + P.board.map(cd).join("") + '<span class="cd e"></span>'.repeat(5 - P.board.length) + '</div><div class="pkm">' + esc(P.msg) + '</div><div class="pks">' + seats + "</div><div>" + ctl + "</div>";
}

/* Peer-to-peer (PeerJS: host relays between guests) */
const PRE = "jakup-casino-";
let net = null, mode = "solo", conns = [], base = "Not connected", link = "";
const status = t => { base = t; $("#net").textContent = t; $("#gs").textContent = t; $("#gate").hidden = /^Room/.test(t); };
$("#lv").onclick = () => leave();
function recv(m, from) {
  if (!m) return;
  if (m.t === "pa" && mode === "host" && from) return pkAct(from.peer, m);
  if (mode === "guest") { if (m.t === "pk") { pk = m.s; return pkUI(); } if (m.t === "pc") { hole = Array.isArray(m.c) ? m.c : []; return pkUI(); } if (m.t === "pcash") return addBal(+m.n || 0); }
  if (m.t !== "s" || m.id === myid) return;
  const p = peers[m.id] || (peers[m.id] = { x: m.x, y: m.y });
  Object.assign(p, { tx: +m.x || 0, ty: +m.y || 0, n: String(m.n || "").slice(0, 12), a: Array.isArray(m.a) ? m.a.slice(0, 5).map(v => v | 0) : [0, 0, 0, 0, 0], f: m.f | 0, m: m.m | 0, b: +m.b || 0, g: m.g | 0, seen: performance.now() });
  if (mode === "host") conns.forEach(c => c !== from && c.open && c.send(m));
}
function wire(c) {
  c.on("data", m => recv(m, c));
  c.on("close", () => { conns = conns.filter(x => x !== c); if (mode === "host") pkLeave(c.peer); if (mode === "guest") leave("Disconnected"); });
}
function leave(msg) {
  pkReset();
  try { net && net.destroy(); } catch (e) {}
  net = null; mode = "solo"; conns = []; link = ""; for (const k in peers) delete peers[k]; status(msg || "Not connected");
}
$("#host").onclick = () => {
  if (net) return;
  if (typeof Peer === "undefined") return status("Multiplayer unavailable offline");
  const code = Math.random().toString(36).slice(2, 6).toUpperCase();
  mode = "host"; status("Opening room …"); net = new Peer(PRE + code);
  net.on("open", () => { link = location.origin + location.pathname + "?room=" + code; status("Room " + code); });
  net.on("connection", c => { conns.push(c); wire(c); c.on("open", () => c.send({ t: "pk", s: pkPub() })); });
  net.on("error", e => leave("Error: " + e.type));
};
$("#join").onclick = () => {
  const code = $("#code").value.trim().toUpperCase();
  if (net || code.length < 4) return;
  if (typeof Peer === "undefined") return status("Multiplayer unavailable offline");
  mode = "guest"; status("Joining …"); net = new Peer();
  net.on("open", () => {
    const c = net.connect(PRE + code);
    c.on("open", () => { conns = [c]; wire(c); link = location.origin + location.pathname + "?room=" + code; status("Room " + code); });
  });
  net.on("error", e => leave(e.type === "peer-unavailable" ? "Room not found" : "Error: " + e.type));
};
$("#net").onclick = () => { if (link && navigator.clipboard) navigator.clipboard.writeText(link).then(() => { $("#net").textContent = "Link copied!"; setTimeout(() => status(base), 1200); }, () => {}); };
setInterval(() => {
  if (!conns.length) return;
  const m = { t: "s", id: myid, x: Math.round(me.x), y: Math.round(me.y), n: me.n, a: me.a, f: me.f, m: me.m, b: me.b, g: me.g };
  conns.forEach(c => c.open && c.send(m));
}, 100);
setInterval(() => {
  const now = performance.now();
  for (const k in peers) if (now - peers[k].seen > 3000) delete peers[k];
  if (net && base.startsWith("Room")) $("#net").textContent = base + " · " + (Object.keys(peers).length + 1) + " online";
}, 1000);
const q = new URLSearchParams(location.search).get("room");
if (q) { $("#code").value = q.slice(0, 4); setTimeout(() => $("#join").click(), 300); }
</script>
